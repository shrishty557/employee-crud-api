
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmployeeHub | Employee Management</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/app.js" defer></script>
</head>

<body>

    <main class="container">

        <!-- HEADER -->
        <header class="topbar">
            <div>
                <h1>EmployeeHub</h1>
                <p>Employee Management Dashboard</p>
            </div>

            <div class="topbar-actions">
                <button
                    type="button"
                    id="themeToggleBtn"
                    class="secondary-btn">
                    🌙 Dark mode
                </button>

                <button
                    type="button"
                    id="addEmployeeBtn"
                    class="primary-btn">
                    + Add Employee
                </button>
            </div>
        </header>

        <!-- DASHBOARD STATISTICS -->
        <section class="stats-container">

            <div class="stat-card">
                <h3>Total Employees</h3>
                <div class="stat-number" id="totalEmployees">0</div>
            </div>

            <div class="stat-card">
                <h3>Departments</h3>
                <div class="stat-number" id="totalDepartments">0</div>
            </div>

            <div class="stat-card">
                <h3>Dashboard Status</h3>
                <div class="stat-number" id="dashboardStatus">Active</div>
            </div>

        </section>

        <!-- ADD EMPLOYEE FORM -->
        <section class="panel" id="addEmployeeForm" hidden>

            <h2>Add New Employee</h2>

            <form id="employeeForm">

                <label for="employeeName">Full Name</label>
                <input
                    type="text"
                    id="employeeName"
                    name="name"
                    placeholder="Enter employee name"
                    required>

                <label for="employeeEmail">Email Address</label>
                <input
                    type="email"
                    id="employeeEmail"
                    name="email"
                    placeholder="Enter email address"
                    required>

                <label for="employeeDepartment">Department</label>
                <input
                    type="text"
                    id="employeeDepartment"
                    name="department"
                    placeholder="Enter department"
                    required>

                <div class="form-buttons">
                    <button type="submit" class="primary-btn">
                        Save Employee
                    </button>

                    <button
                        type="button"
                        id="cancelEmployeeBtn"
                        class="secondary-btn">
                        Cancel
                    </button>
                </div>

                <p id="formMessage" role="status"></p>

            </form>
        </section>

        <!-- EMPLOYEE RECORDS -->
        <section class="panel">

            <h2>Employee Records</h2>

            <div class="search-container">
                <input
                    type="search"
                    id="searchInput"
                    placeholder="Search by name, ID, email or department...">
            </div>

            <div class="table-container">

                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Full Name</th>
                            <th>Email Address</th>
                            <th>Department</th>
                            <th>Created At</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="employeeTableBody">
                        <tr>
                            <td colspan="6">Loading employees...</td>
                        </tr>
                    </tbody>
                </table>

            </div>

            <p id="statusMessage" class="status">
                Connecting to employee database...
            </p>

        </section>

    </main>

</body>
</html>
